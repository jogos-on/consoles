<style>

  background:radial-gradient(900px 420px at 85% -80px,#1b3a8a66,transparent),radial-gradient(700px 400px at 0 100%,#4c1d9533,transparent),var(--bg)}

.sub2{padding:12px 16px 0;color:var(--mu);font-weight:600}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 16px 16px}
.nav button{padding:9px 18px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:999px;background:#0d1224;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}

.nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

footer .l{color:var(--gold)}footer .r{color:var(--snes);text-align:right}
footer small{display:block;color:var(--fg);font-size:1.1rem}
dialog{width:min(640px,94vw);max-height:92vh;border:1px solid #2a3350;border-radius:14px;padding:0;background:#0d1224;color:var(--fg)}
dialog::backdrop{background:#000a}
.in{padding:18px}
.top{display:flow-root}
.top img{float:left;width:130px;height:auto;margin:0 14px 8px 0;object-fit:fill!important;border-radius:6px}
.top h3{margin:0 0 4px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.acts{display:block}
.btn{display:inline-block;margin:10px 8px 0 0;padding:10px 18px;border:0;border-radius:8px;background:var(--gold);color:#1a1300;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn:focus-visible{outline:3px solid var(--snes);outline-offset:2px}
#pix,#dlm{width:min(380px,94vw);text-align:center}
#dlm h3{margin:0 0 8px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
#dlm p{color:var(--mu);margin:0 0 6px}#dlmok{min-height:1.4em;color:var(--gold);font-weight:600;margin-top:6px}
#dlm .btn{display:block;width:100%;margin:8px 0 0}
#pix h3{margin:0 0 8px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
#pixqr{min-height:60px;margin:12px 0;color:var(--mu)}
#pixqr img{width:220px;height:220px;image-rendering:pixelated;background:#fff;border-radius:8px;padding:6px}
.cod{margin:4px 0;padding:8px 10px;border:1px dashed #39425e;border-radius:8px;color:var(--mu);font:.8rem/1.3 monospace;word-break:break-all}
#pixok{min-height:1.4em;color:var(--gold);font-weight:600}
#pix .nt{margin:6px 0 0;color:var(--mu);font-size:.85rem}
.x{float:right;border:0;background:none;color:var(--mu);font-size:1.7rem;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.g .cv{transition:transform .15s}.g:hover .cv{transform:translateY(-3px)}}
@media(max-width:700px){
.hero{position:relative;flex-direction:row;align-items:flex-start;min-height:210px}
.hero>div{position:relative;z-index:1}
.hero img{position:absolute;top:0;right:-8px;z-index:0;flex:none;width:68%;max-width:340px;margin:0}
}
@media(max-width:560px){.sh h2{font-size:1.5rem}}
@media(max-width:400px){.top img,.top .ph{width:40%!important}}
</style>

<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1><span class="a" id="t1">Catálogo</span><span class="b" id="t2">de jogos</span></h1>

      <button type="button" id="lk" class="like" hidden aria-pressed="false"><span class="ic">👍</span> <span id="lkt">Curtir o site</span> <b id="lkn"></b></button>

    </div>

  </div>

</div>
<dialog id="dlg"><div class="in"><button class="x" aria-label="Fechar" onclick="dlg.close()">×</button><div id="det"></div><div id="cm" style="margin-top:16px"></div></div></dialog>

  <h3>Doar uns trocados</h3>

</div></dialog>

<script>
// Preencha com os dados de https://giscus.app (repositório público com Discussions ativadas)
const GISCUS={repo:"jogos-on/consoles",repoId:"R_kgDOV2o_fA",category:"Announcements",categoryId:"DIC_kwDOV2o_fM4DLp4_"};
const CONS_PADRAO=[{id:"ps1",nome:"PS1",frase:"Clássicos que marcaram época!",prop:"1/1",cor:"#3b82f6"},{id:"ps2",nome:"PS2",frase:"Aventuras inesquecíveis!",prop:"5/7",cor:"#4f7cff"},{id:"snes",nome:"Super Nintendo",frase:"A era 16-bits!",prop:"7/5",cor:"#8b5cf6"}];
const SEC={},PROP={};
const ROLO=5,PAG=10,MAXC=6; // 5 no rolo lateral; 10 por página na grade; máx. de colunas
const st={};
let jogos=[],filtro="todos",catF="todas",atual=null,CATS=[];
const catDe=j=>(j&&j.categoria&&j.categoria!=="jogos")?j.categoria:"";
const catNome=id=>(CATS.find(c=>c.id===id)||{nome:id}).nome;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seguro=u=>/^https?:\/\//i.test(u)?u:"";

function aplicarCons(lista){
  Object.keys(SEC).forEach(k=>delete SEC[k]);Object.keys(PROP).forEach(k=>delete PROP[k]);
  lista.forEach(x=>{
    if(!x||!/^[a-z0-9-]+$/i.test(x.id||"")||!x.nome)return;
    SEC[x.id]=[String(x.nome),String(x.frase||"")];
    PROP[x.id]=["1/1","5/7","7/5"].includes(x.prop)?x.prop:"1/1";
    if(/^#[0-9a-f]{6}$/i.test(x.cor||""))document.documentElement.style.setProperty("--"+x.id,x.cor);
    if(!st[x.id]){st[x.id]={ex:false,p:0};try{const v=+localStorage.getItem("cols:"+x.id);if(v>=1&&v<=MAXC)st[x.id].cols=v}catch(e){}}
  });
  if(filtro!=="todos"&&!SEC[filtro])filtro="todos";
  $("cchips").innerHTML=Object.keys(SEC).map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${filtro===c}">${esc(SEC[c][0])}</button>`).join("");
  document.querySelector('[data-f="todos"]').setAttribute("aria-pressed",filtro==="todos");
}
aplicarCons(CONS_PADRAO);
const cfgP=fetch("config.json?"+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})).then(aplicarCfg);
function abrirLink(){const id=new URLSearchParams(location.search).get("jogo");if(id){const j=jogos.find(x=>x.id===id);if(j)abrir(j)}}
fetch("jogos.json?"+Date.now()).then(r=>r.json()).then(d=>{jogos=d;render();return cfgP}).then(abrirLink).catch(()=>{$("grid").innerHTML='<p class="vazio">Não foi possível carregar jogos.json.</p>'});

function iniciarLike(gc){
  const b=$("lk");if(!b||b.dataset.on)return;b.dataset.on="1";
  const base="https://"+gc+".goatcounter.com",K="siteCurtido";
  let n=null,ja=false;try{ja=localStorage.getItem(K)==="1"}catch(e){}
  const pinta=()=>{b.hidden=false;b.setAttribute("aria-pressed",ja);$("lkt").textContent=ja?"Você curtiu":"Curtir o site";$("lkn").textContent=n===null?"":n.toLocaleString("pt-BR")};
  pinta();
  const ler=p=>fetch(base+"/counter/"+p+".json?"+Date.now()).then(r=>r.ok?r.json():{count:"0"}).catch(()=>({count:"0"})).then(d=>parseInt(String(d.count).replace(/\D/g,""),10)||0);
  ler("curtir").then(a=>{n=Math.max(a,ja?1:0);pinta()});
  b.onclick=()=>{
    if(ja)return;ja=true;n=(n||0)+1;
    try{localStorage.setItem(K,"1")}catch(e){}
    new Image().src=base+"/count?p=curtir&e=true&t=Curtida&rnd="+Math.random().toString(36).slice(2,7);
    pinta();
  };
}
function aplicarRedes(l){
  const e=$("redes");if(!e)return;
  const h=(Array.isArray(l)?l:[]).map(r=>{const u=seguro(String(r&&r.url||"").trim());return u&&r.nome?`<a class="rede" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">${esc(String(r.ic||"🔗").slice(0,4))}</span> ${esc(r.nome)}</a>`:""}).join("");
  e.innerHTML=h;e.hidden=!h;
}
function aplicarCfg(c){
  c=c||{};aplicarRedes(c.redes);
  if(c.doacao&&typeof c.doacao==="object"){const d=c.doacao;
    DOA.on=d.on===true;
    if([0,1,2,3,5,10].includes(+d.freq))DOA.freq=+d.freq;
    if(d.titulo)DOA.titulo=String(d.titulo).slice(0,80);
    if(d.texto)DOA.texto=String(d.texto).slice(0,300);
  }
  if(c.gc&&/^[a-z0-9-]+$/i.test(c.gc))iniciarLike(c.gc);
  if(c.gc&&/^[a-z0-9-]+$/i.test(c.gc)&&!document.getElementById("gcs")){const g=document.createElement("script");g.id="gcs";g.async=true;g.dataset.goatcounter="https://"+c.gc+".goatcounter.com/count";g.src="https://gc.zgo.at/count.js";document.head.appendChild(g)}
  if(Array.isArray(c.categorias))CATS=c.categorias.filter(x=>x&&x.id&&x.id!=="jogos");
  if(catF!=="todas"&&!CATS.some(x=>x.id===catF))catF="todas";
  renderCats();
  if(c.titulo1)$("t1").textContent=c.titulo1;
  if(c.titulo2)$("t2").textContent=c.titulo2;
  if(c.subtitulo)$("st").textContent=c.subtitulo;
  if(c.titulo1||c.titulo2)document.title=((c.titulo1||"")+" "+(c.titulo2||"")).trim();
  aplicarCons(Array.isArray(c.consoles)&&c.consoles.length?c.consoles:CONS_PADRAO.map(x=>({...x,frase:(c.frases||{})[x.id]||x.frase})));
  const h=$("hero"),src=c.hero===undefined?"hero.png":c.hero;
  if(src){h.src=src+(c.heroV?"?v="+c.heroV:"");h.hidden=false}
  document.documentElement.style.setProperty("--hero",src?`url("${encodeURI(src+(c.heroV?"?v="+c.heroV:""))}")`:"none");
  if(jogos.length)render();
}
function capa(j){return j.capa?`<img src="${esc(j.capa)}" alt="Capa de ${esc(j.titulo)}" loading="lazy" onerror="this.outerHTML='<div class=ph><span>SEM CAPA</span></div>'">`:`<div class="ph"><span>SEM CAPA</span></div>`}

function card(j,c){return `<button class="g" style="--c:var(--${c})" data-id="${esc(j.id)}"><span class="cv">${j.popular?'<i class="star" title="Popular" aria-hidden="true">★</i>':""}${j.ptbr?'<svg class="br" viewBox="0 0 20 14" title="PT-BR" aria-label="Em português do Brasil"><rect width="20" height="14" fill="#009c3b"/><path d="M10 1.6 18.2 7 10 12.4 1.8 7z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.1" fill="#002776"/><path d="M7 6.2q3-.9 6 .9" stroke="#fff" stroke-width=".55" fill="none"/></svg>':""}${capa(j)}</span><b>${esc(j.titulo)}</b>${j.genero?`<em>${esc(j.genero)}</em>`:""}</button>`}

function renderCats(){
  const e=$("cats");e.hidden=CATS.length<1;
  e.innerHTML=[{id:"todas",nome:"Todas"},...CATS].map(c=>`<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id===catF}">${esc(c.nome)}</button>`).join("");
}
const ordem=(a,b)=>(!!b.popular-!!a.popular)||a.titulo.localeCompare(b.titulo,"pt");
function render(){
  const q=$("q").value.trim().toLowerCase();
  const forc=!!q||filtro!=="todos"||catF!=="todas";
  const html=Object.keys(SEC).filter(c=>filtro==="todos"||filtro===c).map(c=>{
    const l=jogos.filter(j=>j.console===c&&(catF==="todas"||catDe(j)===catF)&&j.titulo.toLowerCase().includes(q)).sort(ordem);
    if(!l.length)return"";
    const ex=forc||st[c].ex;
    let itens,nav="",modo;
    if(!ex){
      modo="rolo";itens=l.slice(0,ROLO);
      if(l.length>ROLO)nav=`<button data-a="mais" data-c="${c}">Mostrar mais (${l.length} jogos)</button>`;
    }else{
      modo="grade";
      const pgs=Math.ceil(l.length/PAG);st[c].p=Math.min(Math.max(st[c].p,0),pgs-1);
      itens=l.slice(st[c].p*PAG,st[c].p*PAG+PAG);
      if(pgs>1)nav=`<button data-a="prev" data-c="${c}"${st[c].p===0?" disabled":""}>‹ Voltar</button><span>${st[c].p+1} / ${pgs}</span><button data-a="next" data-c="${c}"${st[c].p>=pgs-1?" disabled":""}>Avançar ›</button>`;
      if(!forc)nav+=`<button data-a="menos" data-c="${c}">Mostrar menos</button>`;
    }
    const n=` style="--c:var(--${c});--ar:${PROP[c]}${st[c].cols?";--n:"+st[c].cols:""}"`;
    return `<section class="sec ${c}" id="s-${c}" data-c="${c}"${n}><div class="sh"><h2>${SEC[c][0]}</h2><p>${SEC[c][1]}</p><div class="cc"><button class="cb" data-a="col-" data-c="${c}" aria-label="Mais colunas, capas menores">−</button><button class="cb" data-a="col+" data-c="${c}" aria-label="Menos colunas, capas maiores">+</button></div></div><div class="row ${modo}">${itens.map(j=>card(j,c)).join("")}</div><div class="nav"${nav?"":" hidden"}>${nav}</div></section>`;
  }).join("");
  $("grid").innerHTML=html||'<p class="vazio">Nenhum jogo encontrado.</p>';
  document.querySelectorAll("#grid .sec").forEach(ajustarCols);
}
const nCols=sec=>parseInt(getComputedStyle(sec).getPropertyValue("--n"))||2;
// "peek": no rolo, deixa um pedaço do próximo jogo aparecendo quando há mais jogos do que colunas
function ajustarCols(sec){
  const n=nCols(sec),row=sec.querySelector(".row");
  row.classList.toggle("peek",row.classList.contains("rolo")&&row.children.length>n);
  sec.querySelectorAll(".cb").forEach(b=>b.disabled=(b.dataset.a==="col+"&&n<=1)||(b.dataset.a==="col-"&&n>=MAXC));
}
function mudarCols(c,d){
  const sec=document.getElementById("s-"+c);if(!sec)return;
  const n=Math.min(MAXC,Math.max(1,nCols(sec)+d));
  st[c].cols=n;sec.style.setProperty("--n",n);
  try{localStorage.setItem("cols:"+c,n)}catch(e){}
  ajustarCols(sec);
}

$("q").oninput=render;
document.querySelector(".bar").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filtro=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("cats").onclick=e=>{const b=e.target.closest("[data-cat]");if(!b)return;catF=b.dataset.cat;renderCats();render()};
$("grid").onclick=e=>{
  const n=e.target.closest("[data-a]");
  if(n){
    const c=n.dataset.c,a=n.dataset.a;
    if(a==="col-"||a==="col+"){mudarCols(c,a==="col+"?-1:1);return}
    if(a==="mais")st[c].ex=true,st[c].p=0;
    if(a==="menos")st[c].ex=false,st[c].p=0;
    if(a==="prev")st[c].p--;
    if(a==="next")st[c].p++;
    render();
    const sec=document.getElementById("s-"+c);if(sec)sec.scrollIntoView({block:"start"});
    return;
  }
  const b=e.target.closest(".g");if(b)abrir(jogos.find(j=>j.id===b.dataset.id));
};

// Dados do PIX (a cidade e a chave não aparecem na tela; vão apenas dentro do código gerado)
const PIX={nome:"Johnny Mary",banco:"Nubank",cidade:"Extremoz",chave:"hypertv1000@gmail.com"};
let pixCode="";
function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let b=0;b<8;b++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function pixPayload(){
  const conta=tlv("00","br.gov.bcb.pix")+tlv("01",PIX.chave);
  const p=tlv("00","01")+tlv("01","11")+tlv("26",conta)+tlv("52","0000")+tlv("53","986")+tlv("58","BR")+tlv("59",PIX.nome)+tlv("60",PIX.cidade)+tlv("62",tlv("05","***"))+"6304";
  return p+crc16(p);
}
function carregarQR(){
  return window.qrcode?Promise.resolve():new Promise((ok,err)=>{
    const t=document.createElement("script");
    t.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    t.onload=ok;t.onerror=err;document.head.appendChild(t);
  });
}
async function abrirPix(){
  pixCode=pixPayload();
  $("pxn").textContent=PIX.nome;$("pxb").textContent=PIX.banco;
  $("pixv").textContent=pixCode.slice(0,24)+"...";
  $("pixok").textContent="";$("pixqr").textContent="Gerando QR Code...";
  $("pix").showModal();
  try{
    await carregarQR();
    const q=qrcode(0,"M");q.addData(pixCode);q.make();
    $("pixqr").innerHTML=q.createImgTag(5,2);
    const im=$("pixqr").querySelector("img");if(im)im.alt="QR Code Pix";
  }catch(e){$("pixqr").textContent="Não foi possível gerar o QR Code. Use o botão para copiar o código."}
}
const DOA={on:false,freq:3,titulo:"Gostou do site?",texto:"Ele é mantido por uma pessoa só. Se puder ajudar com uns trocados, agradeço muito!"};
let DL_URL="";
function doacaoDeve(){
  if(!DOA.on)return false;
  try{
    if(DOA.freq===0)return sessionStorage.getItem("dlSessao")!=="1";
    return (+localStorage.getItem("dlCont")||0)%DOA.freq===0;
  }catch(e){return false}
}
function doacaoContar(){
  try{if(DOA.freq===0)sessionStorage.setItem("dlSessao","1");else localStorage.setItem("dlCont",String((+localStorage.getItem("dlCont")||0)+1))}catch(e){}
}
function baixarClick(e,a){
  const mostrar=doacaoDeve();doacaoContar();
  if(!mostrar)return true;
  e.preventDefault();DL_URL=a.href;
  $("dlmt").textContent=DOA.titulo;$("dlmx").textContent=DOA.texto;
  $("dlmok").textContent="";$("dlmgo").textContent="Agora não";
  $("dlm").showModal();return false;
}
function continuarDl(){
  const u=DL_URL;DL_URL="";$("dlm").close();
  if(u)window.open(u,"_blank","noopener,noreferrer");
}
async function copiarPixDl(){
  pixCode=pixCode||pixPayload();
  try{await navigator.clipboard.writeText(pixCode)}
  catch(e){const t=document.createElement("textarea");t.value=pixCode;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  $("dlmok").textContent="Pix copiado! Obrigado 💛";$("dlmgo").textContent="Continuar para o download";
}
async function copiarPix(){
  try{await navigator.clipboard.writeText(pixCode)}
  catch(e){const t=document.createElement("textarea");t.value=pixCode;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  $("pixok").textContent="Código copiado!";
  setTimeout(()=>$("pixok").textContent="",2500);
}

const urlJogo=j=>{const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("jogo",j.id);return u.toString()};
async function copiarTxt(t,m){
  try{await navigator.clipboard.writeText(t)}
  catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}
  const o=$("cpok");if(o){o.textContent=m;setTimeout(()=>o.textContent="",2500)}
}
function copiarSenha(){if(atual)copiarTxt(atual.senha,"Senha copiada!")}
async function compartilhar(){
  if(!atual)return;const u=urlJogo(atual);
  if(navigator.share){try{await navigator.share({title:atual.titulo,text:atual.titulo,url:u});return}catch(e){if(e.name==="AbortError")return}}
  copiarTxt(u,"Link copiado!");
}
dlg.addEventListener("close",()=>{atual=null;history.replaceState(null,"",location.pathname)});
function abrir(j){
  if(!j)return;atual=j;history.replaceState(null,"",urlJogo(j));
  const link=seguro(j.link);
  const w=({"1/1":150,"5/7":130,"7/5":170})[PROP[j.console]]||130;
  $("det").innerHTML=`<div class="top">${j.capa?`<img src="${esc(j.capa)}" alt="Capa de ${esc(j.titulo)}" style="aspect-ratio:${PROP[j.console]||"3/4"};width:${w}px">`:`<div class="ph" style="aspect-ratio:${PROP[j.console]||"3/4"};width:${w}px"><span>SEM CAPA</span></div>`}<h3>${esc(j.titulo)}</h3><div style="color:var(--mu)">${(SEC[j.console]||[""])[0]}${catDe(j)?" - "+esc(catNome(catDe(j))):""}${j.genero?" - "+esc(j.genero):""}${j.ano?" - "+esc(j.ano):""}</div>${j.descricao?`<p>${esc(j.descricao)}</p>`:""}${j.senha?`<p class="pw">Senha: <b>${esc(j.senha)}</b><button class="btn alt sm" onclick="copiarSenha()">Copiar</button></p>`:""}<div class="acts">${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer" onclick="return baixarClick(event,this)">Baixar</a>`:""}<button class="btn alt" onclick="compartilhar()">Compartilhar</button><button class="btn alt" onclick="abrirPix()">Doar uns trocados</button><span id="cpok" role="status"></span></div></div>`;
  const im=$("det").querySelector(".top img");
  if(im)im.onerror=()=>{const d=document.createElement("div");d.className="ph";d.style.cssText=im.style.cssText;d.innerHTML="<span>SEM CAPA</span>";im.replaceWith(d)};
  const s=document.createElement("script");
  s.src="https://giscus.app/client.js";s.async=true;s.crossOrigin="anonymous";
  Object.entries({repo:GISCUS.repo,"repo-id":GISCUS.repoId,category:GISCUS.category,"category-id":GISCUS.categoryId,mapping:"specific",term:j.id,"reactions-enabled":"1","input-position":"top",theme:"dark",lang:"pt",loading:"lazy"}).forEach(([k,v])=>s.setAttribute("data-"+k,v));
  $("cm").replaceChildren(s);
  dlg.showModal();
}
</script>
