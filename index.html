<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--hero:url("hero.png");--bg:#070a14;--fg:#eef1f8;--mu:#8e98b3;--gold:#e8b923;--ps1:#3b82f6;--ps2:#4f7cff;--snes:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:16px/1.45 Barlow,"Trebuchet MS",system-ui,sans-serif;
  background:radial-gradient(900px 420px at 85% -80px,#1b3a8a66,transparent),radial-gradient(700px 400px at 0 100%,#4c1d9533,transparent),var(--bg)}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
h1,h2,.cond{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 0 8px}
h1{margin:0;font-style:italic;font-weight:800;font-size:clamp(3rem,13vw,6.5rem);line-height:.9;letter-spacing:-.01em}
h1 span{display:block}
h1 .a{background:linear-gradient(#fff,#aeb6c8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .b{background:linear-gradient(#ffd75a,#c98f0a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;font-size:1.15rem}
.sub i{width:28px;height:5px;border-radius:3px;background:var(--ps1)}
.hero img{flex:0 1 46%;width:46%;aspect-ratio:1000/540;max-height:300px;object-fit:contain}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0}
.bar input{flex:1 1 180px;padding:10px 14px;border:1px solid #2a3350;border-radius:10px;background:#0d1224;color:var(--fg);font:inherit}
.chip{padding:9px 16px;border:1px solid #2a3350;border-radius:999px;background:#0d1224;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1300}
.chip:focus-visible,.g:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sec{--c:var(--ps1);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:16px;background:#0a0f1fcc;margin:18px 0;overflow:hidden}
.sec.ps2{--c:var(--ps2)}.sec.snes{--c:var(--snes)}
.sec.ps1{--ar:1/1}.sec.ps2{--ar:5/7;--min:140px}.sec.snes{--ar:7/5}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 16px 0 0;border-bottom:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.sh h2{margin:0;padding:12px 44px 12px 20px;font-style:italic;font-size:1.9rem;line-height:1;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 25%,#000));clip-path:polygon(0 0,calc(100% - 26px) 0,100% 100%,0 100%)}
.sh p{margin:0;color:var(--c);font-weight:700;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:1.1rem;filter:brightness(1.4)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,150px),1fr));gap:14px;padding:16px}
.g{all:unset;cursor:pointer;display:block;text-align:center}
.cv{display:block;border:1px solid #39425e;border-radius:6px;overflow:hidden;background:#151b30}
.cv img,.ph{width:100%;aspect-ratio:var(--ar,3/4);object-fit:cover;display:block}
.ph{display:grid;place-items:center;padding:6px;text-align:center;background:#151b30 var(--hero) center/contain no-repeat}
.ph span{font:italic 800 1.55rem/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;color:#ffd400;text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,0 5px 6px #0009}
.top .ph{float:left;width:130px;margin:0 14px 8px 0;border-radius:6px}
.g b{display:block;margin-top:8px;font:700 .95rem/1.15 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.g em{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:5px;font:normal 600 .72rem/1.3 Barlow,sans-serif;text-transform:uppercase;color:color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 22%,#0a0f1f)}
.sub2{padding:12px 16px 0;color:var(--mu);font-weight:600}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 16px 16px}
.nav button{padding:9px 18px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:999px;background:#0d1224;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav span{color:var(--mu);min-width:60px;text-align:center}
.vazio{text-align:center;color:var(--mu);padding:40px 0}
footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0 48px;font-weight:700;font-size:1.5rem;line-height:1.1}
footer .l{color:var(--gold)}footer .r{color:var(--snes);text-align:right}
footer small{display:block;color:var(--fg);font-size:1.1rem}
dialog{width:min(640px,94vw);max-height:92vh;border:1px solid #2a3350;border-radius:14px;padding:0;background:#0d1224;color:var(--fg)}
dialog::backdrop{background:#000a}
.in{padding:18px}
.top{display:flow-root}
.top img{float:left;width:130px;height:auto;margin:0 14px 8px 0;object-fit:cover;border-radius:6px}
.top h3{margin:0 0 4px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.acts{display:block}
.btn{display:inline-block;margin:10px 8px 0 0;padding:10px 18px;border:0;border-radius:8px;background:var(--gold);color:#1a1300;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn:focus-visible{outline:3px solid var(--snes);outline-offset:2px}
#pix{width:min(380px,94vw);text-align:center}
#pix h3{margin:0 0 8px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
#pixqr{min-height:60px;margin:12px 0;color:var(--mu)}
#pixqr img{width:220px;height:220px;image-rendering:pixelated;background:#fff;border-radius:8px;padding:6px}
.cod{margin:4px 0;padding:8px 10px;border:1px dashed #39425e;border-radius:8px;color:var(--mu);font:.8rem/1.3 monospace;word-break:break-all}
#pixok{min-height:1.4em;color:var(--gold);font-weight:600}
#pix .nt{margin:6px 0 0;color:var(--mu);font-size:.85rem}
.x{float:right;border:0;background:none;color:var(--mu);font-size:1.7rem;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.g .cv{transition:transform .15s}.g:hover .cv{transform:translateY(-3px)}}
@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start;gap:8px}.hero img{flex:none;width:100%;max-width:520px;margin:0 auto}}
@media(max-width:560px){.sh h2{font-size:1.5rem}}
@media(max-width:400px){.top img,.top .ph{width:40%!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1><span class="a" id="t1">Catálogo</span><span class="b" id="t2">de jogos</span></h1>
      <div class="sub"><i></i><span id="st">Reviva grandes clássicos!</span><i></i></div>
    </div>
    <img id="hero" alt="" hidden onerror="this.remove()">
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar jogo" aria-label="Buscar jogo">
    <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-f="ps1" aria-pressed="false">PS1</button>
    <button class="chip" data-f="ps2" aria-pressed="false">PS2</button>
    <button class="chip" data-f="snes" aria-pressed="false">SNES</button>
  </div>
  <main id="grid"></main>
  <footer><div class="l cond">Escolha seu clássico<small class="cond">e boa jogatina!</small></div><div class="r cond">Game over?<small class="cond">Jamais.</small></div></footer>
</div>
<dialog id="dlg"><div class="in"><button class="x" aria-label="Fechar" onclick="dlg.close()">×</button><div id="det"></div><div id="cm" style="margin-top:16px"></div></div></dialog>
<dialog id="pix"><div class="in"><button class="x" aria-label="Fechar" onclick="document.getElementById('pix').close()">×</button>
  <h3>Doar uns trocados</h3>
  <div>Nome: <b id="pxn"></b><br>Banco: <b id="pxb"></b></div>
  <div id="pixqr"></div>
  <div class="cod" id="pixv"></div>
  <button class="btn" onclick="copiarPix()">Copiar Pix copia e cola</button>
  <div id="pixok" role="status"></div>
  <p class="nt">Sem valor definido: doe quanto quiser, digitando o valor no app do seu banco.</p>
</div></dialog>

<script>
// Preencha com os dados de https://giscus.app (repositório público com Discussions ativadas)
const GISCUS={repo:"jogos-on/consoles",repoId:"R_kgDOV2o_fA",category:"Announcements",categoryId:"DIC_kwDOV2o_fM4DLp4_"};
const SEC={ps1:["PS1","Clássicos que marcaram época!"],ps2:["PS2","Aventuras inesquecíveis!"],snes:["Super Nintendo","A era 16-bits!"]};
const PROP={ps1:"1/1",ps2:"5/7",snes:"7/5"};
const POP=6,PAGE=12;
const st={ps1:{ex:false,p:0},ps2:{ex:false,p:0},snes:{ex:false,p:0}};
let jogos=[],filtro="todos";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seguro=u=>/^https?:\/\//i.test(u)?u:"";

fetch("jogos.json?"+Date.now()).then(r=>r.json()).then(d=>{jogos=d;render()}).catch(()=>{$("grid").innerHTML='<p class="vazio">Não foi possível carregar jogos.json.</p>'});

function aplicarCfg(c){
  c=c||{};
  if(c.titulo1)$("t1").textContent=c.titulo1;
  if(c.titulo2)$("t2").textContent=c.titulo2;
  if(c.subtitulo)$("st").textContent=c.subtitulo;
  if(c.titulo1||c.titulo2)document.title=((c.titulo1||"")+" "+(c.titulo2||"")).trim();
  Object.keys(c.frases||{}).forEach(k=>{if(SEC[k]&&c.frases[k])SEC[k][1]=c.frases[k]});
  const h=$("hero"),src=c.hero===undefined?"hero.png":c.hero;
  if(src){h.src=src+(c.heroV?"?v="+c.heroV:"");h.hidden=false}
  document.documentElement.style.setProperty("--hero",src?`url("${encodeURI(src+(c.heroV?"?v="+c.heroV:""))}")`:"none");
  if(jogos.length)render();
}
fetch("config.json?"+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})).then(aplicarCfg);

function capa(j){return j.capa?`<img src="${esc(j.capa)}" alt="Capa de ${esc(j.titulo)}" loading="lazy" onerror="this.outerHTML='<div class=ph><span>SEM CAPA</span></div>'">`:`<div class="ph"><span>SEM CAPA</span></div>`}

function card(j,c){return `<button class="g" style="--c:var(--${c})" data-id="${esc(j.id)}"><span class="cv">${capa(j)}</span><b>${esc(j.titulo)}</b>${j.genero?`<em>${esc(j.genero)}</em>`:""}</button>`}

function render(){
  const q=$("q").value.trim().toLowerCase();
  const html=Object.keys(SEC).filter(c=>filtro==="todos"||filtro===c).map(c=>{
    const l=jogos.filter(j=>j.console===c&&j.titulo.toLowerCase().includes(q)).sort((a,b)=>a.titulo.localeCompare(b.titulo,"pt"));
    if(!l.length)return"";
    const forcado=!!q||filtro!=="todos",ex=forcado||st[c].ex;
    let itens,rotulo,nav="";
    if(!ex){
      let pop=l.filter(j=>j.popular);if(!pop.length)pop=l;
      itens=pop.slice(0,POP);rotulo="Mais populares";
      if(l.length>itens.length)nav=`<button data-a="mais" data-c="${c}">Mostrar mais (${l.length} jogos)</button>`;
    }else{
      const tot=Math.ceil(l.length/PAGE),pg=Math.min(st[c].p,tot-1);st[c].p=pg;
      itens=l.slice(pg*PAGE,(pg+1)*PAGE);rotulo=q?"Resultados da busca":"Todos os jogos";
      if(tot>1)nav+=`<button data-a="prev" data-c="${c}" aria-label="Página anterior" ${pg===0?"disabled":""}>&lsaquo;</button><span>${pg+1} / ${tot}</span><button data-a="next" data-c="${c}" aria-label="Próxima página" ${pg>=tot-1?"disabled":""}>&rsaquo;</button>`;
      if(!forcado)nav+=`<button data-a="menos" data-c="${c}">Mostrar menos</button>`;
    }
    return `<section class="sec ${c}" id="s-${c}"><div class="sh"><h2>${SEC[c][0]}</h2><p>${SEC[c][1]}</p></div><div class="sub2">${rotulo}</div><div class="row">${itens.map(j=>card(j,c)).join("")}</div>${nav?`<div class="nav">${nav}</div>`:""}</section>`;
  }).join("");
  $("grid").innerHTML=html||'<p class="vazio">Nenhum jogo encontrado.</p>';
}

$("q").oninput=render;
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("grid").onclick=e=>{
  const n=e.target.closest("[data-a]");
  if(n){
    const c=n.dataset.c,a=n.dataset.a;
    if(a==="mais")st[c].ex=true,st[c].p=0;
    if(a==="menos")st[c].ex=false;
    if(a==="prev")st[c].p--;
    if(a==="next")st[c].p++;
    render();
    const sec=document.getElementById("s-"+c);if(sec)sec.scrollIntoView({block:"start"});
    return;
  }
  const b=e.target.closest(".g");if(b)abrir(jogos.find(j=>j.id===b.dataset.id));
};

// Dados do PIX (a cidade e a chave não aparecem na tela; vão apenas dentro do código gerado)
const PIX={nome:"Johnny Mary",banco:"Nubank",cidade:"Extremoz",chave:"hypertv1000@gmail.com"};
let pixCode="";
function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let b=0;b<8;b++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function pixPayload(){
  const conta=tlv("00","br.gov.bcb.pix")+tlv("01",PIX.chave);
  const p=tlv("00","01")+tlv("01","11")+tlv("26",conta)+tlv("52","0000")+tlv("53","986")+tlv("58","BR")+tlv("59",PIX.nome)+tlv("60",PIX.cidade)+tlv("62",tlv("05","***"))+"6304";
  return p+crc16(p);
}
function carregarQR(){
  return window.qrcode?Promise.resolve():new Promise((ok,err)=>{
    const t=document.createElement("script");
    t.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    t.onload=ok;t.onerror=err;document.head.appendChild(t);
  });
}
async function abrirPix(){
  pixCode=pixPayload();
  $("pxn").textContent=PIX.nome;$("pxb").textContent=PIX.banco;
  $("pixv").textContent=pixCode.slice(0,24)+"...";
  $("pixok").textContent="";$("pixqr").textContent="Gerando QR Code...";
  $("pix").showModal();
  try{
    await carregarQR();
    const q=qrcode(0,"M");q.addData(pixCode);q.make();
    $("pixqr").innerHTML=q.createImgTag(5,2);
    const im=$("pixqr").querySelector("img");if(im)im.alt="QR Code Pix";
  }catch(e){$("pixqr").textContent="Não foi possível gerar o QR Code. Use o botão para copiar o código."}
}
async function copiarPix(){
  try{await navigator.clipboard.writeText(pixCode)}
  catch(e){const t=document.createElement("textarea");t.value=pixCode;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  $("pixok").textContent="Código copiado!";
  setTimeout(()=>$("pixok").textContent="",2500);
}

function abrir(j){
  if(!j)return;
  const link=seguro(j.link);
  const w={ps1:150,ps2:130,snes:170}[j.console]||130;
  $("det").innerHTML=`<div class="top">${j.capa?`<img src="${esc(j.capa)}" alt="Capa de ${esc(j.titulo)}" style="aspect-ratio:${PROP[j.console]||"3/4"};width:${w}px">`:`<div class="ph" style="aspect-ratio:${PROP[j.console]||"3/4"};width:${w}px"><span>SEM CAPA</span></div>`}<h3>${esc(j.titulo)}</h3><div style="color:var(--mu)">${(SEC[j.console]||[""])[0]}${j.genero?" - "+esc(j.genero):""}${j.ano?" - "+esc(j.ano):""}</div>${j.descricao?`<p>${esc(j.descricao)}</p>`:""}<div class="acts">${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Baixar jogo</a>`:""}<button class="btn alt" onclick="abrirPix()">Doar uns trocados</button></div></div>`;
  const im=$("det").querySelector(".top img");
  if(im)im.onerror=()=>{const d=document.createElement("div");d.className="ph";d.style.cssText=im.style.cssText;d.innerHTML="<span>SEM CAPA</span>";im.replaceWith(d)};
  const s=document.createElement("script");
  s.src="https://giscus.app/client.js";s.async=true;s.crossOrigin="anonymous";
  Object.entries({repo:GISCUS.repo,"repo-id":GISCUS.repoId,category:GISCUS.category,"category-id":GISCUS.categoryId,mapping:"specific",term:j.id,"reactions-enabled":"1","input-position":"top",theme:"dark",lang:"pt",loading:"lazy"}).forEach(([k,v])=>s.setAttribute("data-"+k,v));
  $("cm").replaceChildren(s);
  dlg.showModal();
}
</script>
</body>
</html>
